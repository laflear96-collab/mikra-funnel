<!-- ===== QUIZ POPUP — JS ===== -->
<script>
(function(){
  var YM_COUNTER = 103738778;
  var overlay = document.getElementById('quizOverlay');
  if (!overlay) return;

  function open(){ overlay.classList.add('open'); document.body.style.overflow='hidden'; }
  function close(){ overlay.classList.remove('open'); document.body.style.overflow=''; }

  document.querySelectorAll('[data-quiz-open]').forEach(function(b){
    b.addEventListener('click', function(e){ e.preventDefault(); open(); });
  });
  document.querySelectorAll('[data-quiz-close]').forEach(function(b){
    b.addEventListener('click', close);
  });
  overlay.addEventListener('click', function(e){ if (e.target === overlay) close(); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && overlay.classList.contains('open')) close();
  });

  document.querySelectorAll('.quiz-opt').forEach(function(opt){
    opt.addEventListener('click', function(){
      var goal = opt.getAttribute('data-goal');
      var href = opt.getAttribute('data-href') || '#';
      if (window.ym) { try { ym(YM_COUNTER, 'reachGoal', goal); } catch(e){} }
      // редирект с небольшой задержкой, чтобы цель успела уйти
      setTimeout(function(){ window.location.href = href; }, 120);
    });
  });

  // Глобальное API: openQuiz() / closeQuiz()
  window.openQuiz = open;
  window.closeQuiz = close;
})();
</script>
